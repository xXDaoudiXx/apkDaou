<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>REVOC - Downloads</title>
    <style>
        body {
            background: url('images/background.jpg') no-repeat center center fixed;
            background-color: #000; 
            background-size: cover;
            background-blend-mode: overlay;
            background-color: rgba(0, 0, 0, 0.5);
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding-top: 30px;
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* --- ÉCLAIRS TOMBANTS --- */
        .bolt-particle {
            position: fixed;
            top: -50px;
            color: #00d4ff;
            font-size: 24px;
            text-shadow: 0 0 10px #00d4ff, 0 0 20px #fff;
            user-select: none;
            pointer-events: none;
            z-index: 1;
            animation: fallAnimation linear infinite;
        }
        @keyframes fallAnimation {
            0% { transform: translateY(0) translateX(0) scale(0.8); opacity: 0; }
            10% { opacity: 1; }
            100% { transform: translateY(110vh) translateX(5px) scale(1.2); opacity: 0; }
        }

        .header-title {
            color: #fff; 
            font-size: 50px; 
            font-weight: 900;
            font-style: italic;
            letter-spacing: 8px;
            margin-bottom: 20px;
            text-transform: none; 
            text-shadow: 0 0 20px #00d4ff, 0 0 40px #00d4ff;
            z-index: 10;
        }

        /* --- MODIFICATION ICI : BARRE BLANCHE AVEC NÉON BLEU --- */
        .section-name {
            color: #fff;
            margin: 20px 0 10px 0;
            /* La bordure est blanche */
            border-bottom: 2px solid #ffffff; 
            padding-bottom: 5px;
            width: 80%;
            max-width: 500px;
            z-index: 10;
            display: flex;
            align-items: center; 
            justify-content: center;
            /* Le filtre ajoute l'éclat bleu autour du blanc */
            filter: drop-shadow(0 0 5px #00d4ff) drop-shadow(0 0 10px #00d4ff);
        }

        .section-title-icon {
            width: 50px; 
            height: auto;
            margin-right: 50px;
        }

        .section-title-icon-right {
            width: 50px; 
            height: auto;
            margin-left: 50px;
        }

        .neon-text {
            color: #ffffff; 
            text-shadow: 0 0 8px #00d4ff, 0 0 15px #00d4ff;
            font-style: italic; 
            font-weight: bold;  
            font-size: 35px; 
            text-transform: none; 
        }

        .link {
            width: 85%; 
            max-width: 420px;
            padding: 15px 20px; 
            margin: 8px;
            border: 2px solid rgba(0, 212, 255, 0.4); 
            border-radius: 18px;
            color: white;
            text-decoration: none; 
            background: rgba(0, 0, 0, 0.8); 
            backdrop-filter: blur(12px);
            transition: all 0.3s ease;
            display: flex; 
            align-items: center; 
            z-index: 10;
            position: relative;
        }

        .link:hover { 
            background: rgba(0, 0, 0, 0.9);
            transform: scale(1.03);
            border-color: #00d4ff; 
            box-shadow: 0 0 10px #00d4ff, inset 0 0 5px #00d4ff; 
        }

        .btn-icon {
            width: 45px; height: 45px;
            border-radius: 10px;
            object-fit: cover;
            position: absolute;
            left: 15px;
        }

        .btn-text-container {
            flex: 1; 
            text-align: center;
        }

        .btn-title { display: block; font-size: 16px; font-weight: bold; }
        .subtitle { color: #00d4ff; font-size: 11px; text-transform: uppercase; }
    </style>
</head>
<body>
